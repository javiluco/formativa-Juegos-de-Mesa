<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayHead - Juegos de Mesa</title>
    <!-- Enlace CSS  -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
    <header>
        <nav class="navbar lg:navbar-expand bg-navbar py-2" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="img/logo2.png" alt="PLAYHEAD" class="img-logo flotar"
                        style="max-height: 40px; width: auto;">
                </a>
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                    data-bs-target="#navbarNavMenu" aria-controls="navbarNavMenu" aria-expanded="false"
                    aria-label="Abrir menú">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>
                <dialog class="drawer drawer-end bg-navbar" tabindex="-1" id="navbarNavMenu"
                    aria-labelledby="navbarNavMenuLabel">
                    <div class="drawer-header">
                        <h5 class="drawer-title" id="navbarNavMenuLabel">Menú</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Cerrar"></button>
                    </div>
                    <div class="drawer-body">
                        <ul class="navbar-nav lg:ms-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="estrategia.html">Estrategia</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="familiares.html">Familiares</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" aria-current="page" href="cartas.html">Cartas</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="juegos-party.html">Juegos Party</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="registro.html">Registrarse</a>
                            </li>
                        </ul>
                    </div>
                </dialog>
            </div>
        </nav>
    </header>


    <main>

        <div class="container">
            <div class="row align-items-center">
                <div class="col-12 md:col-6 mt-4">
                    <h3>FORMULARIO DE REGISTRO</h3>
                    <form id="formRegistro" novalidate>
                        <div class="mb-3">
                            <label for="inputName" class="form-label fg-black">Nombre</label>
                            <input type="text" class="form-control" id="inputName" name="inputName" required>
                            <div class="invalid-feedback">Este campo es obligatorio.</div>
                        </div>
                        <div class="mb-3">
                            <label for="inputLastname" class="form-label fg-black">Apellido</label>
                            <input type="text" class="form-control" id="inputLastname" name="inputLastname" required>
                            <div class="invalid-feedback">Este campo es obligatorio.</div>
                        </div>
                        <div class="mb-3">
                            <label for="inputUsername" class="form-label fg-black">Nombre de usuario</label>
                            <input type="text" class="form-control" id="inputUsername" name="inputUsername" required>
                            <div class="invalid-feedback">Este campo es obligatorio.</div>
                        </div>
                        <div class="mb-3">
                            <label for="inputBirthdate" class="form-label fg-black">Fecha de nacimiento</label>
                            <input type="date" class="form-control" id="inputBirthdate" name="inputBirthdate" required>
                            <div class="invalid-feedback">Este campo es obligatorio.</div>
                        </div>
                        <div class="mb-3">
                            <label for="inputEmail" class="form-label fg-black">Email</label>
                            <input type="email" class="form-control" id="inputEmail" name="inputEmail" required>
                            <div class="invalid-feedback">Ingresa un email válido.</div>
                        </div>
                        <div class="mb-3">
                            <label for="inputPassword1" class="form-label fg-black">Contraseña</label>
                            <input type="password" class="form-control" id="inputPassword1" name="inputPassword1"
                                required>
                            <div class="invalid-feedback">Este campo es obligatorio.</div>
                        </div>
                        <div class="mb-3">
                            <label for="inputPassword2" class="form-label fg-black">Repetir Contraseña</label>
                            <input type="password" class="form-control" id="inputPassword2" name="inputPassword2"
                                required>
                            <div class="invalid-feedback" id="password2Feedback">Este campo es obligatorio.</div>
                        </div>
                        <div class="mb-3">
                            <label for="inputAddress" class="form-label fg-black">Dirección de despacho
                                (opcional)</label>
                            <input type="text" class="form-control" id="inputAddress" name="inputAddress">
                        </div>

                        <div class="d-flex gap-2 justify-content-center mt-6">
                            <button type="submit" class="btn-solid theme-primary">Enviar</button>
                            <button type="reset" class="btn-solid btn-styled theme-secondary" id="btnLimpiar">Limpiar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>



    </main>


    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
